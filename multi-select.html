<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamlab Image Review</title>
  <link rel="stylesheet" href="multi-select.css" />
</head>
<body>
  <main class="shell">
    <div class="bg-orb bg-orb-left" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-right" aria-hidden="true"></div>

    <header class="header panel">
      <div class="header-title-wrap">
        <div class="eyebrow-row">
          <span class="brand-dot" aria-hidden="true"></span>
          <p class="eyebrow">Dreamlab Capture Review</p>
        </div>
        <h1>Select Images from This Page</h1>
        <p id="sourceLabel" class="source-label">Source page</p>
      </div>
      <button id="closeBtn" class="icon-btn" type="button" aria-label="Close">×</button>
    </header>

    <section class="toolbar panel">
      <div class="toolbar-row">
        <div class="stats-strip">
          <div class="stat-pill">
            <span class="stat-label">Visible</span>
            <strong id="visibleCount">0</strong>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Total</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat-pill stat-pill-active">
            <span class="stat-label">Selected</span>
            <strong id="selectedCount">0</strong>
          </div>
        </div>
        <button id="toggleViewBtn" class="btn btn-neutral" type="button">Show all images</button>
      </div>
      <p id="scopeHint" class="scope-hint">Visible only: images currently on-screen in the source tab.</p>

      <div class="destination-grid">
        <div class="field">
          <label for="workspaceSelect">Workspace</label>
          <select id="workspaceSelect">
            <option value="">Select workspace</option>
          </select>
        </div>

        <div class="field">
          <label for="collectionSelect">Collection</label>
          <select id="collectionSelect">
            <option value="">No collection</option>
          </select>
        </div>

        <div class="field">
          <label for="tagsInput">Tags</label>
          <input id="tagsInput" type="text" placeholder="campaign, references, spring-shoot" autocomplete="off" />
        </div>

        <div class="field">
          <label for="resolutionSelect">Resolution</label>
          <select id="resolutionSelect">
            <option value="any">Any size</option>
            <option value="small">Small (400x300+)</option>
            <option value="medium">Medium (640x480+)</option>
            <option value="large">Large (1024x768+)</option>
            <option value="icon">Icon (<=200x200)</option>
          </select>
        </div>
      </div>

      <div class="filters-row" aria-label="Image type filters">
        <div id="typeFilters" class="type-filter-group" role="group" aria-label="Type filters">
          <button type="button" class="type-chip" data-type-filter="high" aria-pressed="false">High image</button>
          <button type="button" class="type-chip" data-type-filter="icon" aria-pressed="false">Icon</button>
          <button type="button" class="type-chip" data-type-filter="profile" aria-pressed="false">Profile</button>
          <button type="button" class="type-chip" data-type-filter="ad" aria-pressed="false">Ad</button>
          <button type="button" class="type-chip" data-type-filter="other" aria-pressed="false">Other</button>
        </div>
        <button id="resetFiltersBtn" class="btn btn-neutral" type="button">Reset filters</button>
      </div>
    </section>

    <section class="grid-wrap panel">
      <div id="imageGrid" class="image-grid" role="list"></div>
      <div id="emptyState" class="empty-state" hidden>No images available for this scope.</div>
    </section>

    <footer class="footer panel">
      <div class="footer-left">
        <button id="selectAllBtn" class="btn btn-neutral" type="button">Select all</button>
        <button id="deselectAllBtn" class="btn btn-neutral" type="button">Clear</button>
        <span id="blockedSummary" class="blocked-summary" hidden></span>
      </div>

      <div class="footer-right">
        <span class="selected-copy">Review and route your selected captures.</span>
        <button id="cancelBtn" class="btn btn-neutral" type="button">Cancel</button>
        <button id="saveBtn" class="btn btn-brand" type="button" disabled>Save Selected</button>
      </div>
    </footer>

    <div id="status" class="status" role="status"></div>
  </main>

  <script src="multi-select.js"></script>
</body>
</html>
