<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamlab Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell" aria-live="polite">
    <header class="popup-header">
      <div class="brand-dot" aria-hidden="true"></div>
      <div>
        <h1>Dreamlab Capture</h1>
        <p>Review and route this capture to a collection.</p>
      </div>
    </header>

    <section id="preview-container" class="panel preview-panel">
      <div id="preview-text" class="preview-empty">No pending capture found.</div>
    </section>

    <section class="panel form-panel">
      <div class="field-grid">
        <div class="field">
          <label for="workspace-select">Workspace</label>
          <select id="workspace-select">
            <option value="">Select workspace</option>
          </select>
        </div>

        <div class="field">
          <label for="collection-select">Collection</label>
          <select id="collection-select">
            <option value="">No collection</option>
          </select>
        </div>

        <div class="field">
          <label for="tags-input">Tags</label>
          <input type="text" id="tags-input" placeholder="design, inspiration" autocomplete="off" />
        </div>
      </div>
    </section>

    <div class="action-row">
      <button id="refresh-btn" class="btn btn-neutral" type="button">Refresh</button>
      <button id="save-btn" class="btn btn-brand" type="button" disabled>Save Capture</button>
    </div>

    <section class="panel shortcuts-panel">
      <div class="shortcuts-header">
        <span>Quick Actions</span>
        <button id="shortcuts-refresh-btn" class="btn btn-neutral btn-xs" type="button">Reload</button>
      </div>
      <div id="shortcut-actions" class="shortcut-actions"></div>
    </section>

    <div id="status" class="status" role="status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
