<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamlab Widget</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell" aria-live="polite">
    <header class="popup-header">
      <h1>Dreamlab Widget</h1>
    </header>

    <section class="toggle-card" aria-label="Widget visibility">
      <div class="toggle-copy">
        <h2>Show floating widget</h2>
        <p>Enable the in-page capture widget on websites.</p>
      </div>
      <label class="switch" for="widget-enabled">
        <input id="widget-enabled" type="checkbox" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </section>

    <section class="disclosure-card" aria-label="Compliance disclosure">
      <h2>Compliance disclosure</h2>
      <p id="host-access" class="disclosure-line">Checking host access scope...</p>
      <p id="capture-model" class="disclosure-line">Checking capture safeguards...</p>
      <div class="doc-actions">
        <button id="open-privacy-doc" type="button" class="settings-link">Privacy policy</button>
        <button id="open-compliance-doc" type="button" class="settings-link">Compliance checklist</button>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>
    <button id="open-widget-settings" type="button" class="settings-link">Widget settings</button>
    <p class="hint">All capture actions and settings are available in the floating widget.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
